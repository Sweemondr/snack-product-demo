<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snack 项目会议日程 Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./snack-entry-refactor-demo.css?v=project-group-members-v20" />
    <script src="./vendor/lucide.min.js" defer></script>
    <script src="./snack-entry-refactor-demo.js?v=project-group-members-v20" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" data-sidebar aria-label="Snack 入口">
        <header class="brand">
          <span class="brand-logo"><img src="./assets/logo-title.png" alt="Snack" /></span>
          <span class="brand-actions">
            <button type="button" data-sidebar-search-toggle aria-label="搜索会话" title="搜索会话"><i data-lucide="search"></i></button>
            <button type="button" data-sidebar-collapse-toggle aria-label="收起侧边栏" title="收起侧边栏"><i data-lucide="panel-left"></i></button>
          </span>
          <button class="sidebar-expand-action" type="button" data-sidebar-collapse-toggle aria-label="展开侧边栏" title="展开侧边栏">
            <span><img src="./assets/logo-title.png" alt="" /></span>
            <i data-lucide="panel-left"></i>
          </button>
        </header>

        <section class="sidebar-search-panel" data-sidebar-search-panel hidden>
          <header>
            <i data-lucide="search"></i>
            <input type="search" data-sidebar-search-input placeholder="搜索项目、群聊或会话" autocomplete="off" />
            <button type="button" data-sidebar-search-close aria-label="关闭搜索"><i data-lucide="x"></i></button>
          </header>
          <div class="sidebar-search-results" data-sidebar-search-results>
            <p>输入关键词开始搜索</p>
          </div>
        </section>

        <nav class="entry-nav" aria-label="一级入口">
          <button class="nav-action" data-view="chat" title="新会话" aria-label="新会话">
            <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M7.14286 8.85714H2V7.14286H7.14286V2H8.85714V7.14286H14V8.85714H8.85714V14H7.14286V8.85714Z" fill="currentColor" /></svg>
            <span>新会话</span>
          </button>
          <button class="nav-action" data-sidebar-group-chat title="发起群聊" aria-label="发起群聊">
            <i data-lucide="users-round"></i>
            <span>发起群聊</span>
          </button>

          <button class="nav-row active" data-view="tasks" title="任务工作台" aria-label="任务工作台">
            <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M4.7 12.2H11.3V10.8H4.7V12.2ZM4.7 9.4H11.3V8H4.7V9.4ZM3.35 15C2.97875 15 2.66094 14.8629 2.39656 14.5888C2.13219 14.3146 2 13.985 2 13.6V2.4C2 2.015 2.13219 1.68542 2.39656 1.41125C2.66094 1.13708 2.97875 1 3.35 1H9.95L14 5.2V13.6C14 13.985 13.8678 14.3146 13.6034 14.5888C13.3391 14.8629 13.0213 15 12.65 15H3.35ZM9.275 5.9V2.4H3.35V13.6H12.65V5.9H9.275Z" fill="currentColor" /></svg>
            <span>任务工作台</span>
          </button>
          <button class="nav-row" data-view="agents" title="智能体员工" aria-label="智能体员工">
            <svg aria-hidden="true" viewBox="0 0 16 16" fill="none"><path d="M8 4.5H3V6.5M8 4.5H13V6.5M8 4.5L5.91667 2M8 4.5L10.0833 2M13 6.5H15V10.5H13M13 6.5V10.5M13 10.5V13.5H3V10.5M3 6.5H1V10.5H3M3 6.5V10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="5.25" y="7.5" width="1.5" height="2.5" rx="0.75" fill="currentColor"/><rect x="9.25" y="7.5" width="1.5" height="2.5" rx="0.75" fill="currentColor"/></svg>
            <span>智能体员工</span>
          </button>
          <button class="nav-row" data-view="apps" title="应用" aria-label="应用">
            <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M6.88281 8.65117C7.2418 8.65117 7.5332 8.94258 7.5332 9.30156V13.9363C7.5331 14.2952 7.24173 14.5867 6.88281 14.5867H2.25C1.89108 14.5867 1.59972 14.2952 1.59961 13.9363V9.30156C1.59961 8.94258 1.89101 8.65117 2.25 8.65117H6.88281ZM13.3691 8.65117C13.7281 8.65117 14.0195 8.94258 14.0195 9.30156V13.9363C14.0194 14.2952 13.7281 14.5867 13.3691 14.5867H8.73633C8.37741 14.5867 8.08604 14.2952 8.08594 13.9363V9.30156C8.08594 8.94258 8.37734 8.65117 8.73633 8.65117H13.3691ZM2.90039 13.2869H6.2334V9.95195H2.90039V13.2869ZM9.38672 13.2869H12.7197V9.95195H9.38672V13.2869ZM10.5928 1.89043C10.8466 1.63659 11.2589 1.63659 11.5127 1.89043L14.1338 4.51152C14.3876 4.76536 14.3876 5.1776 14.1338 5.43145L11.5127 8.05254C11.2589 8.30638 10.8466 8.30638 10.5928 8.05254L7.97168 5.43145C7.71784 5.1776 7.71784 4.76536 7.97168 4.51152L10.5928 1.89043ZM6.88281 2.16289C7.2418 2.16289 7.5332 2.4543 7.5332 2.81328V7.44805C7.5331 7.80694 7.24173 8.09844 6.88281 8.09844H2.25C1.89108 8.09844 1.59972 7.80694 1.59961 7.44805V2.81328C1.59961 2.4543 1.89101 2.16289 2.25 2.16289H6.88281Z" fill="currentColor" /></svg>
            <span>应用</span>
          </button>
        </nav>

        <section class="sidebar-list project-history" id="projectHistory" aria-label="历史会话"></section>

        <footer class="sidebar-footer">
          <img src="./assets/user.png" alt="" />
          <span>
            <strong>田晓柔</strong>
          </span>
        </footer>
      </aside>

      <main class="workbench">
        <header class="topbar">
          <div class="topbar-main">
            <nav class="secondary-tabs" id="secondaryTabs" aria-label="二级入口" hidden></nav>
          </div>
          <div class="topbar-actions" id="topbarActions"></div>
        </header>

        <section class="content-grid">
          <section class="main-surface" id="mainSurface"></section>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>
    <section class="meeting-demo-controls" id="meetingDemoControls" aria-label="会议 Demo 控制"></section>
  </body>
</html>
